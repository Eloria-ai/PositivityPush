[tool:pytest]
# Pytest configuration for Positivity Push Backend

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Coverage settings (if using pytest-cov)
# --cov=app
# --cov-report=term-missing
# --cov-report=html:htmlcov
# --cov-fail-under=80

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database, external APIs)
    slow: Slow tests (network calls, heavy processing)
    auth: Authentication related tests
    webhook: Webhook endpoint tests
    ai: AI service tests (OpenAI, mem0)
    timezone: Timezone handling tests
    onboarding: User onboarding flow tests

# Minimum version
minversion = 6.0

# Test session configuration
console_output_style = progress
junit_family = xunit2

# Asyncio configuration
asyncio_mode = auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*ssl.*:DeprecationWarning